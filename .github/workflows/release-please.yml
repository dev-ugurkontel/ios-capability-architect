name: Release Please

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Dispatch required checks for the release pull request
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          release_branch="$(jq -er '.headBranchName' <<<"$RELEASE_PR")"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$release_branch"
          gh workflow run codeql.yml --repo "$GITHUB_REPOSITORY" --ref "$release_branch"

  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-package.yml
    with:
      tag: ${{ needs.release.outputs.tag_name }}

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run repository verification
        run: npm run verify
      - name: Prove generated artifacts are current
        run: git diff --exit-code -- plugins/ios-capability-architect/bundle
      - name: Audit production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

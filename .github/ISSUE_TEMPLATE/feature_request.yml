name: Feature proposal
description: Propose a new tool, workflow, integration, or substantial behavior change.
title: "[Proposal]: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues, pull requests, and the roadmap.
          required: true
        - label: This proposal does not rely on private APIs, review bypasses, or unverified entitlement access.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user need and why current behavior is insufficient.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe observable behavior and measurable acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Compatibility, privacy, and security impact
      description: Cover schema/tool compatibility, data handling, network access, and migration needs.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Official sources
      description: Link official Apple or OpenAI documentation that supports relevant platform claims.
